<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKMChats - Login</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #121212; color: white; }
        input { padding: 10px; font-size: 16px; margin: 10px; border-radius: 5px; border: 1px solid #ccc; width: 250px; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h2>VKMChats Phone Authentication</h2>

    <!-- Step 1: Phone Number Section -->
    <div id="phone-section">
        <p>Apna mobile number daalein (Country code ke sath, jaise +91):</p>
        <input type="text" id="phone-number" placeholder="+919876543210"><br>
        <button id="send-otp-btn">Send OTP</button>
    </div>

    <!-- Step 2: OTP Section (Initially Hidden) -->
    <div id="otp-section" style="display:none;">
        <p>SMS me aaya 6-digit OTP daalein:</p>
        <input type="text" id="otp-code" placeholder="123456"><br>
        <button id="verify-otp-btn">Verify OTP</button>
    </div>

    <!-- Firebase reCAPTCHA container (Yeh zaroori hai!) -->
    <div id="recaptcha-container"></div>

    <!-- Firebase aur Login ka Logic yahan likha hai -->
    <script type="module">
        // Firebase SDK CDN se import karein
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Apni Firebase Config yahan dalein
        const firebaseConfig = {
          apiKey: "Aapki_API_Key",
          authDomain: "vkmchats.firebaseapp.com",
          projectId: "vkmchats",
          storageBucket: "vkmchats.appspot.com",
          messagingSenderId: "Aapka_Sender_Id",
          appId: "Aapka_App_Id"
        };

        // Firebase initialize karein
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // reCAPTCHA Verifier setup karein
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
          'size': 'invisible', // Invisible reCAPTCHA
          'callback': (response) => {
            // reCAPTCHA verified
          }
        });

        // Jab user "Send OTP" button dabaye
        document.getElementById('send-otp-btn').addEventListener('click', () => {
          const phoneNumber = document.getElementById('phone-number').value;
          const appVerifier = window.recaptchaVerifier;

          if (!phoneNumber) {
            alert("Kripya phone number daalein!");
            return;
          }

          signInWithPhoneNumber(auth, phoneNumber, appVerifier)
            .then((confirmationResult) => {
              // SMS successfully bhej diya gaya hai
              window.confirmationResult = confirmationResult;
              alert("OTP SMS successfully bhej diya gaya hai!");
              
              // Phone section chhupayein aur OTP section dikhayein
              document.getElementById('phone-section').style.display = 'none';
              document.getElementById('otp-section').style.display = 'block';
            })
            .catch((error) => {
              console.error("SMS Error:", error);
              alert("SMS bhejne me error aaya: " + error.message);
            });
        });

        // Jab user "Verify OTP" button dabaye
        document.getElementById('verify-otp-btn').addEventListener('click', () => {
          const code = document.getElementById('otp-code').value;

          if (!code) {
            alert("Kripya OTP daalein!");
            return;
          }

          window.confirmationResult.confirm(code).then((result) => {
            const user = result.user;
            alert("Login Safal Rahi! User UID: " + user.uid);
            // Yahan par aap user ko chat page par redirect kar sakte hain
          }).catch((error) => {
            console.error("Invalid OTP:", error);
            alert("Galat OTP daala gaya hai!");
          });
        });
    </script>
</body>
</html>

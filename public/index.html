<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKM CHATS</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #121212; color: white; }
        .container { max-width: 400px; margin: auto; padding: 20px; }
        input { padding: 12px; font-size: 16px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; width: 100%; background: #222; color: white; box-sizing: border-box; }
        button { padding: 12px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>VKM CHATS</h2>
        <h3>Phone Authentication</h3>

        <div id="phone-section">
            <p style="font-size: 14px; color: #aaa;">Apna mobile number daalein (+91 ke sath):</p>
            <input type="text" id="phone-number" placeholder="+919186377359">
            <button id="send-otp-btn">Send OTP</button>
        </div>

        <div id="otp-section" style="display:none;">
            <p style="font-size: 14px; color: #aaa;">6-digit OTP daalein:</p>
            <input type="text" id="otp-code" placeholder="123456">
            <button id="verify-otp-btn">Verify OTP</button>
        </div>

        <div id="recaptcha-container"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDLU5tZX0ihJ5JHswEYs1tqf1MppJooxm9",
          authDomain: "vkmchats.firebaseapp.com",
          projectId: "vkmchats",
          storageBucket: "vkmchats.firebasestorage.app",
          messagingSenderId: "923628112475",
          appId: "1:923628112475:web:d835bb678149f68e494d7e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
          'size': 'invisible',
          'callback': (response) => {}
        });

        document.getElementById('send-otp-btn').addEventListener('click', () => {
          let phoneNumber = document.getElementById('phone-number').value.trim();
          if (!phoneNumber) { alert("Kripya phone number daalein!"); return; }
          if (!phoneNumber.startsWith('+')) { phoneNumber = '+' + phoneNumber; }

          signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier)
            .then((confirmationResult) => {
              window.confirmationResult = confirmationResult;
              alert("OTP SMS bhej diya gaya hai!");
              document.getElementById('phone-section').style.display = 'none';
              document.getElementById('otp-section').style.display = 'block';
            })
            .catch((error) => {
              console.error("SMS Error:", error);
              alert("SMS bhejne me error aaya: " + error.message);
            });
        });

        document.getElementById('verify-otp-btn').addEventListener('click', () => {
          const code = document.getElementById('otp-code').value.trim();
          if (!code) { alert("Kripya OTP daalein!"); return; }

          window.confirmationResult.confirm(code).then((result) => {
            alert("Login Safal Rahi! User UID: " + result.user.uid);
          }).catch((error) => {
            alert("Galat OTP daala gaya hai!");
          });
        });
    </script>
</body>
</html>
